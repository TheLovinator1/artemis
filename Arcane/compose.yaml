---
networks:
  arcane_internal:
    driver: bridge
    name: arcane_internal
services:
  arcane:
    container_name: arcane
    image: ghcr.io/getarcaneapp/manager:latest
    restart: unless-stopped
    depends_on:
      - docker_socket_proxy
      - arcane_postgres
    environment:
      - APP_URL=http://apollo:3552
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
      - LOG_JSON=true
      - ENCRYPTION_KEY=${ARCANE_ENCRYPTION_KEY?Add Arcane encryption key to .env file}
      - JWT_SECRET=${ARCANE_JWT_SECRET?Add Arcane JWT secret to .env file}
      - POSTGRES_DB=arcane
      - POSTGRES_USER=arcane
      - OIDC_ENABLED=false
      - DISK_USAGE_PATH=/mnt/Docker/Data
      - AUTO_UPDATE=true
      - AUTO_UPDATE_INTERVAL=0 */6 * * *
      - AUTO_HEAL_ENABLED=true
      - AUTO_HEAL_INTERVAL=*/5 * * * *
      - DOCKER_API_TIMEOUT=60
      - DOCKER_IMAGE_PULL_TIMEOUT=1200
      - PROJECTS_DIRECTORY=/mnt/Docker/Data/artemis
      - DOCKER_HOST=tcp://docker_socket_proxy:2375
      - DATABASE_URL=postgresql://arcane:${ARCANE_DATABASE_PASSWORD?Add Arcane database password to .env file}@arcane_postgres:5432/arcane
    networks:
      - arcane_internal
    ports:
      - 3552:3552
    volumes:
      - /mnt/Docker/Data/Arcane/data:/app/data
      - /mnt/Docker/Data/artemis:/mnt/Docker/Data/artemis
  arcane_postgres:
    container_name: arcane_postgres
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=arcane
      - POSTGRES_USER=arcane
      - POSTGRES_PASSWORD=${ARCANE_DATABASE_PASSWORD?Add Arcane database password to .env file}
    networks:
      - arcane_internal
    restart: unless-stopped
    volumes:
      - /mnt/Docker/Data/Arcane/postgres:/var/lib/postgresql/data
  docker_socket_proxy:
    container_name: arcane_docker_proxy
    image: tecnativa/docker-socket-proxy:latest
    privileged: true
    restart: unless-stopped
    environment:
      - EVENTS=1
      - PING=1
      - VERSION=1
      - AUTH=0
      - SECRETS=0
      - POST=1
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1
      - DISTRIBUTION=0
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=1
    networks:
      - arcane_internal
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
...
